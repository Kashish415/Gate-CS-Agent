[project]
name = "gate-cs-agent"
version = "0.1.0"
description = "Agentic pipeline that generates, verifies and publishes daily GATE-CS practice questions to Telegram."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepeval>=4.2.1",
    "groq>=0.9.0",
    "langchain-groq>=0.2.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0",
    "python-telegram-bot>=22.8",
]

[project.scripts]
gate-cs-agent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
