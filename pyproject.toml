[project]
name = "gate-cs-agent"
version = "0.1.0"
description = "Agentic pipeline that generates, verifies and publishes daily GATE-CS practice questions to Telegram."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepeval>=4.2.1",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]
