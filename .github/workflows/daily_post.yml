name: daily-gate-cs-post
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p observability data
          aws s3 cp s3://${{ secrets.R2_BUCKET }}/daily_log.db observability/daily_log.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || true
          aws s3 cp s3://${{ secrets.R2_BUCKET }}/verified_cache.json data/verified_cache.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || true
      - run: pip install uv && uv sync
      - name: Run tests
        run: uv run pytest tests/ -v
      - run: uv run gate-cs-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: true
          LANGSMITH_PROJECT: gate-cs-agent
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      - name: Persist state to R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp observability/daily_log.db s3://${{ secrets.R2_BUCKET }}/daily_log.db \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
          aws s3 cp data/verified_cache.json s3://${{ secrets.R2_BUCKET }}/verified_cache.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
