name: daily-gate-cs-post
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            observability/daily_log.db
            data/verified_cache.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      - run: pip install uv && uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

      - run: uv run gate-cs-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: true
          LANGSMITH_PROJECT: gate-cs-agent
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            observability/daily_log.db
            data/verified_cache.json
          key: pipeline-state-${{ github.run_id }}
